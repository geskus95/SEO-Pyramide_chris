name: Deploy to Netcup via SFTP

on:
  push:
    branches:
      - claude/plan-seo-structure-01QZFruPp9PPTeauLDF2Q3Fk  # Default Branch

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demo-site/package-lock.json

      - name: Install dependencies
        working-directory: ./demo-site
        run: npm ci

      - name: Build Next.js (Static Export)
        working-directory: ./demo-site
        run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./demo-site/out/*
          remote_path: /wunschturm.de/httpdocs/lesewelt/
          sftp_only: true

      - name: Deployment Summary
        run: |
          echo "✅ Deployment erfolgreich!"
          echo "🌐 Website erreichbar unter: https://wunschturm.de/lesewelt/"
